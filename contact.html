<head>

<link rel="preconnect" href="https://fonts.googleapis.com">

<body data-page="contact" class="">
<div id="hd"></div>
<main class="ct" style="padding-inline:var(--pad);padding-bottom:120px">
<div class="rv"><p class="lb">Contact</p><h1>Speak with a jewellery specialist.</h1><p class="big">WhatsApp is the fastest way to reach us.</p>
<dl><dt>Studio</dt><dd>Surat, Gujarat, India</dd><dt>Hours</dt><dd>Monday to Saturday, 10am to 7pm</dd><dt>Email</dt><dd><a href="mailto:hello@ecomaura.com">hello@ecomaura.com</a></dd></dl>

<label>Message<textarea name="note" rows="4"></textarea></label><button class="btn" type="submit">Continue on WhatsApp</button></form>
</main>
